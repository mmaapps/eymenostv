name: EYMEN OS TV derle ve yayınla

on:
  push:
    branches: [main, surum-1.1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eymen-os
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Yazı tiplerini indir
        shell: bash
        run: |
          mkdir -p tv/src/main/assets/fonts
          curl -fsSL -o tv/src/main/assets/fonts/Sora.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/sora/Sora%5Bwght%5D.ttf" || true
          curl -fsSL -o tv/src/main/assets/fonts/Manrope.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf" || true
          curl -fsSL -o tv/src/main/assets/fonts/GreatVibes.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/greatvibes/GreatVibes-Regular.ttf" || true
      - name: APK derle
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :tv:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          mkdir -p telefon/src/main/assets
          cp tv/build/outputs/apk/release/tv-release.apk telefon/src/main/assets/EYMEN-OS-TV.apk
          curl -fsSL -o telefon/src/main/assets/EYMEN-TV.apk https://github.com/mmustafatasoy/EymenTv/releases/latest/download/EYMEN-TV.apk
          gradle :telefon:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log
          test -s tv/build/outputs/apk/release/tv-release.apk
          test -s telefon/build/outputs/apk/release/telefon-release.apk
      - name: Kararlı sürümü yayınla
        id: release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName *= *"' tv/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="v$VERSION"
          mkdir -p dist
          cp tv/build/outputs/apk/release/tv-release.apk dist/EYMEN-OS-TV.apk
          cp telefon/build/outputs/apk/release/telefon-release.apk dist/EYMEN-Kurulum.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest --prerelease=false --notes-file RELEASE.md
          else
            gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EYMEN OS TV $VERSION" --notes-file RELEASE.md --latest
          fi
      - name: Sonucu ci-logs dalına yaz
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          touch build.log
          mkdir -p /tmp/ci
          { echo "sha=$GITHUB_SHA"; echo "build=$BUILD_RESULT"; echo "release=$RELEASE_RESULT"; echo "---- errors"; grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -300 || true; echo "---- tail"; tail -80 build.log; } > /tmp/ci/latest.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.txt
          git commit -qm "ci: build=$BUILD_RESULT release=$RELEASE_RESULT"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
