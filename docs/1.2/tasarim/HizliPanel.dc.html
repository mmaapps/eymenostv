<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Hızlı panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8C27A}a:hover{color:#F2D9A6}
.ch{flex:1;height:76px;border-radius:14px;background:rgba(214,226,255,.06);border:1px solid rgba(214,226,255,.09)}
.ap{flex:1;height:86px;border-radius:12px;background:#17213D;border:1px solid rgba(214,226,255,.1)}
.q{box-sizing:border-box;border-radius:14px;background:#101A33;border:1px solid #26324F;padding:14px;display:flex;flex-direction:column;gap:10px;font:inherit;color:#F2F4F8;text-align:left;cursor:pointer}
.qi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.ql{font-size:15px;font-weight:800}
.qv{font-size:12px;font-weight:600;color:#A3ACBF;margin-top:2px}
.chip{font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;border:1px solid #3A4A72;color:#C9D0DD}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Manrope',sans-serif;color:#F2F4F8;background:radial-gradient(120% 120% at 85% 0%,#14204A 0%,#070B16 55%,#05080F 100%)">
  <div aria-hidden="true" style="position:absolute;inset:0;padding:22px 64px 12px;display:flex;flex-direction:column;gap:14px;opacity:.38">
    <div style="height:44px;display:flex;align-items:center;gap:12px">
      <div style="width:34px;height:34px;border-radius:10px;background:#E8C27A"></div>
      <div style="font-family:'Sora',sans-serif;font-size:19px;font-weight:600;letter-spacing:3px">EYMEN OS</div>
      <div style="flex:1"></div>
      <div style="font-family:'Sora',sans-serif;font-size:26px">21:42</div>
    </div>
    <div style="display:flex;gap:32px;height:280px">
      <div style="width:498px;border-radius:4px;background:linear-gradient(135deg,#1C2B55,#0B1226)"></div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px">
        <div style="font-size:12px;color:#E8C27A;font-weight:800;letter-spacing:2px">ŞİMDİ YAYINDA</div>
        <div style="font-family:'Sora',sans-serif;font-size:34px;font-weight:600">Akşam Haberleri</div>
      </div>
    </div>
    <div style="display:flex;gap:14px"><div class="ch"></div><div class="ch"></div><div class="ch"></div><div class="ch"></div><div class="ch"></div><div class="ch"></div></div>
    <div style="display:flex;gap:12px"><div class="ap"></div><div class="ap"></div><div class="ap"></div><div class="ap"></div><div class="ap"></div><div class="ap"></div><div class="ap"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,15,0) 30%,rgba(5,8,15,.85) 62%)"></div>

  <aside aria-label="Hızlı panel" style="position:absolute;top:18px;right:18px;bottom:18px;width:440px;box-sizing:border-box;border-radius:22px;background:rgba(7,11,22,.96);border:1px solid rgba(232,194,122,.3);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:22px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:10px;background:#F5B85C;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div style="font-family:'Sora',sans-serif;font-size:22px;font-weight:600;flex:1">Hızlı panel</div>
      <div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:500;color:#C9D0DD">21:42</div>
    </div>

    <div style="border-radius:14px;background:#F2F4F8;color:#0A1224;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <span style="font-weight:800;font-size:15px;flex:1">Ses</span>
        <span style="font-family:'Sora',sans-serif;font-weight:700;font-size:18px">32</span>
      </div>
      <div style="height:8px;border-radius:4px;background:rgba(10,18,36,.16)"><div style="width:32%;height:8px;border-radius:4px;background:#0A1224"></div></div>
      <div style="font-size:12px;font-weight:700;color:#3A4459">◀ ▶ ile ayarla · OK sessiz</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <button class="q"><span class="qi" style="background:#A9B2FF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></span><span><span class="ql" style="display:block">Uyku zamanlayıcı</span><span class="qv" style="display:block">Kapalı</span></span></button>
      <button class="q"><span class="qi" style="background:#6FA8FF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg></span><span><span class="ql" style="display:block">Ekran yansıtma</span><span class="qv" style="display:block;color:#7BE08A">Hazır</span></span></button>
      <button class="q"><span class="qi" style="background:#FF8FB3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span><span class="ql" style="display:block">Görüntü ayarı</span><span class="qv" style="display:block">TV menüsünü açar</span></span></button>
      <button class="q"><span class="qi" style="background:#7BE08A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0M2 8.8a16 16 0 0 1 20 0"/><circle cx="12" cy="20" r="1"/></svg></span><span><span class="ql" style="display:block">Wi-Fi</span><span class="qv" style="display:block">Bağlı</span></span></button>
      <button class="q"><span class="qi" style="background:#9DD8C8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span><span class="ql" style="display:block">Ekran koruyucu</span><span class="qv" style="display:block">Şimdi başlat</span></span></button>
      <button class="q"><span class="qi" style="background:#FF9A9A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><span><span class="ql" style="display:block">Çocuk modu</span><span class="qv" style="display:block">Kapalı</span></span></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:800;color:#A3ACBF;letter-spacing:1px">UYKU ZAMANLAYICI</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip" style="background:#E8C27A;color:#1E1505;border-color:transparent">Kapalı</span><span class="chip">15 dk</span><span class="chip">30 dk</span><span class="chip">60 dk</span><span class="chip">90 dk</span>
      </div>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:#A3ACBF">
      <span style="width:14px;height:14px;border-radius:4px;background:#4C8DFF"></span><span style="flex:1">Mavi tuş: aç / kapat</span><span>Geri: kapat</span>
    </div>
  </aside>
</div>
</x-dc>

</body>
</html>
